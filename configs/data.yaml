raw_dir: data/raw
processed_dir: data/processed
bgg_source: kaggle  # placeholder: kaggle | bgg_api | local
min_ratings_per_user: 5
min_ratings_per_game: 10

# LLM (Ollama) used for context annotation. Host/port come from .env
# (OLLAMA_HOST / OLLAMA_PORT); only non-secret settings live here.
llm:
  model: "gemma4:latest"   # faster AND more accurate than 26b on spot-checks (2026-05-30)
  timeout_s: 120
  options:
    temperature: 0.0
  # This Ollama host serializes on one GPU, so concurrency>1 only causes queue
  # timeouts (it does not speed anything up). Raise only if OLLAMA_NUM_PARALLEL
  # is increased server-side. Checkpoint flushes every N completed games to resume.
  concurrency: 1
  checkpoint_every: 100

# Context label schema produced by src/annotate.py.
# tier: 1=BGG field reshape, 2=category/mechanic rule, 3=LLM judgment
annotation:
  # Only run the expensive Tier-3 LLM pass on games with at least this many
  # ratings (the games groups actually pick). Tier-1/2 still run on every game;
  # games below the threshold get NA Tier-3 labels, backfilled by lowering this
  # and re-running (resumes from checkpoint). null/omit = annotate all games.
  tier3_min_ratings: 500
  labels:
    # Tier 1 — reshaped from BGG structured fields
    - name: language_dependence
      tier: 1
      scale: "int 1-5"
    - name: min_age_fit
      tier: 1
      scale: "int 1-5"
    - name: complexity
      tier: 1
      scale: "int 1-5"
    # Tier 2 — derived from category/mechanic tag lookup
    - name: player_elimination
      tier: 2
      scale: "int 1-5"   # 1=absent, 5=present
    - name: coop_vs_competitive
      tier: 2
      scale: "str: coop | semi-coop | team | competitive"
    - name: social_conflict
      tier: 2
      scale: "int 1-5"   # 1=absent, 5=present
    # Tier 3 — LLM judgment (one chat call per game)
    - name: party_friendliness
      tier: 3
      scale: "int 1-5"
    - name: interaction_level
      tier: 3
      scale: "int 1-5"
    - name: competitiveness
      tier: 3
      scale: "int 1-5"
    - name: downtime
      tier: 3
      scale: "int 1-5"
    - name: teach_time
      tier: 3
      scale: "int 1-5"
    - name: mixed_skill_robustness
      tier: 3
      scale: "int 1-5"
